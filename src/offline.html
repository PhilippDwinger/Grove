<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline – Grove</title>
  <link rel="icon" href="/bilder/marke/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/basis.css">
  <style>
    /* Offline-Seite: wird vom Service Worker vorab gespeichert. Kein JavaScript, keine Schrift von außen nötig. */
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; text-align: center; }
    .offline { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .offline svg { width: 96px; height: 96px; opacity: .9; }
    .offline h1 { margin: 8px 0 0; font: 400 2.2rem/1.1 var(--font-display); }
    .offline p { margin: 0; color: var(--text-soft); line-height: 1.55; }
    .offline a { margin-top: 10px; padding: 11px 20px; border-radius: 999px; background: var(--amber); color: var(--auf-akzent); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main class="offline">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <circle cx="256" cy="256" r="212" fill="none" stroke="#E3A15A" stroke-width="40" stroke-dasharray="40 26" opacity=".55"/>
      <circle cx="248" cy="262" r="128" fill="none" stroke="#E3A15A" stroke-width="34" opacity=".8"/>
      <circle cx="244" cy="266" r="56" fill="#E3A15A"/>
    </svg>
    <h1>Gerade kein Netz</h1>
    <p>Grove ist hier, aber die Verbindung nach draußen fehlt. Sobald du wieder online bist, geht es weiter.</p>
    <a href="/">Nochmal versuchen</a>
  </main>
  <script>addEventListener("online", () => location.reload())</script>
</body>
</html>
